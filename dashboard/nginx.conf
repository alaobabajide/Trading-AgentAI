server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    # Vite content-hashed assets — cache forever (hash changes on every build)
    location /assets/ {
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA entry point — no-cache so browsers always pick up new asset hashes
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # SPA routing — serve index.html for all client-side routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Proxy Brain API — points to Railway brain service
    location /api/ {
        proxy_pass https://trading-agentai-production.up.railway.app/;
        proxy_ssl_server_name on;
        proxy_set_header Host trading-agentai-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
