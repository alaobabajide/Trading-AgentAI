server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/* → uvicorn on localhost:8000
    # Authentication is handled by FastAPI middleware (X-Api-Key header).
    # /api/health is exempt from auth in the FastAPI middleware so Railway
    # liveness probes always succeed without needing the API key.
    location /api/ {
        proxy_pass            http://127.0.0.1:8000/;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout    300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
    }

    # Vite content-hashed assets — cache forever (hash changes on every build)
    location /assets/ {
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA entry point — must never be cached so browsers always pick up new
    # asset hashes after a deploy. Without this, users run stale JS bundles
    # indefinitely even after Railway pushes new code.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # SPA fallback — all routes return index.html (same no-cache policy)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
